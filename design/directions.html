<title>Progress Bar Directions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: three phone frames side by side, each the same workout screen in its own palette; frames wrap to one column on a phone. */
:root {
  --page: #f4f3f0; --page-ink: #1b1a18; --page-muted: #62605a; --page-line: #d9d6cf;
  --sans: "Golos Text", system-ui, sans-serif;
  --num: "Fira Sans Extra Condensed", "Arial Narrow", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #131312; --page-ink: #efeeea; --page-muted: #a3a099; --page-line: #2c2b28; color-scheme: dark } }
:root[data-theme="dark"] { --page: #131312; --page-ink: #efeeea; --page-muted: #a3a099; --page-line: #2c2b28; color-scheme: dark }

body { background: var(--page); color: var(--page-ink); font-family: var(--sans); padding-inline: 16px; padding-block: 28px 48px; }
.intro { max-width: 68ch; margin: 0 auto 28px; }
.intro h1 { font: 700 28px/32px var(--sans); margin: 0 0 8px; text-wrap: balance; }
.intro p { margin: 0; font-size: 16px; line-height: 24px; color: var(--page-muted); }
.row { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; }
.option { display: grid; gap: 12px; width: 360px; max-width: 100%; }
.option h2 { font: 700 20px/26px var(--sans); margin: 0; }
.option p { margin: 0; font-size: 14px; line-height: 20px; color: var(--page-muted); }

/* Each direction defines its own palette */
.phone[data-v="sea"] {
  --ground: #e9f1ee; --ink: #0f201d; --muted: #456059; --accent: #0c6f66; --on-accent: #ffffff;
  --glass: rgba(255,255,255,0.52); --glass-strong: rgba(255,255,255,0.7); --edge: rgba(255,255,255,0.85);
  --sunken: rgba(15,32,29,0.07); --rod: rgba(15,32,29,0.38); --ok: #0c6b3e; --under: #8a4b00;
  --b1: #6fd3c4; --b2: #9fd2f2; --b3: #ffcfa6; --shadow: 0 18px 40px rgba(20,60,54,0.18);
}
.phone[data-v="dusk"] {
  --ground: #1b1114; --ink: #fff4ec; --muted: #d2bbb0; --accent: #ffab52; --on-accent: #2b1503;
  --glass: rgba(44,26,30,0.46); --glass-strong: rgba(36,21,25,0.66); --edge: rgba(255,226,206,0.18);
  --sunken: rgba(255,244,236,0.1); --rod: rgba(255,244,236,0.42); --ok: #8fe3ad; --under: #ffc566;
  --b1: #ff6a45; --b2: #c43d68; --b3: #ffb23e; --shadow: 0 18px 44px rgba(0,0,0,0.5);
}
.phone[data-v="night"] {
  --ground: #0a1519; --ink: #eaf7f4; --muted: #a2bdb9; --accent: #62ead2; --on-accent: #05211d;
  --glass: rgba(16,36,41,0.48); --glass-strong: rgba(12,28,33,0.68); --edge: rgba(190,255,244,0.16);
  --sunken: rgba(234,247,244,0.09); --rod: rgba(234,247,244,0.4); --ok: #7fe6a4; --under: #ffcf70;
  --b1: #16a596; --b2: #2a62e8; --b3: #49cf7c; --shadow: 0 18px 44px rgba(0,0,0,0.5);
}

.phone { position: relative; width: 100%; aspect-ratio: 360 / 760; border-radius: 40px; overflow: hidden; background: var(--ground); color: var(--ink); box-shadow: 0 0 0 1px var(--page-line), 0 24px 48px rgba(0,0,0,0.16); isolation: isolate; }
.blob { position: absolute; border-radius: 50%; filter: blur(46px); opacity: 0.85; z-index: -1; }
.blob.one { width: 68%; aspect-ratio: 1; left: -22%; top: -6%; background: var(--b1); }
.blob.two { width: 62%; aspect-ratio: 1; right: -24%; top: 26%; background: var(--b2); }
.blob.three { width: 74%; aspect-ratio: 1; left: 6%; bottom: -10%; background: var(--b3); }
.phone[data-v="dusk"] .blob, .phone[data-v="night"] .blob { opacity: 0.6; }

.glass { background: var(--glass); -webkit-backdrop-filter: blur(26px) saturate(1.5); backdrop-filter: blur(26px) saturate(1.5); border: 1px solid var(--edge); }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.unit { color: var(--muted); margin-left: 3px; }
.label { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.02em; color: var(--muted); }

.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 44px 12px 12px; gap: 8px; }
.top { padding: 0 6px 4px; display: grid; gap: 10px; }
.top h3 { margin: 0; font: 700 24px/28px var(--sans); }
.barbell { display: flex; align-items: center; gap: 10px; }
.bar { position: relative; flex: 1; display: flex; align-items: center; gap: 6px; height: 40px; padding-left: 12px; }
.bar::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 5px; margin-top: -2.500px; border-radius: 3px; background: var(--rod); }
.plate { position: relative; width: 14px; height: 40px; border-radius: 7px; background: var(--sunken); box-shadow: inset 0 0 0 2px var(--rod); }
.plate.done { background: var(--accent); box-shadow: none; }
.plate.now { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }
.collar { position: relative; width: 9px; height: 18px; border-radius: 3px; background: var(--ink); }
.count { font-size: 24px; line-height: 26px; font-weight: 700; white-space: nowrap; }

.item { border-radius: 18px; padding: 11px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.item b { font-size: 15px; line-height: 20px; font-weight: 600; }
.item .fact { font-size: 20px; line-height: 22px; font-weight: 700; white-space: nowrap; }
.item .plan { font-size: 13px; line-height: 18px; color: var(--muted); white-space: nowrap; }
.item.current { background: var(--glass-strong); box-shadow: inset 0 0 0 2px var(--accent); border-color: transparent; }
.chip { display: inline-block; margin-top: 2px; font-size: 12px; line-height: 16px; font-weight: 600; }
.chip.ok { color: var(--ok); } .chip.under { color: var(--under); }

.entry { margin-top: auto; border-radius: 28px; padding: 14px; display: grid; gap: 8px; background: var(--glass-strong); box-shadow: var(--shadow); }
.entry .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.entry .head b { font-size: 16px; line-height: 22px; }
.entry .head .num { font-size: 17px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.field { display: grid; grid-template-columns: 1fr 50px 50px; align-items: end; gap: 6px; }
.field .value { font-size: 38px; line-height: 38px; font-weight: 700; }
.field .value.hero { font-size: 64px; line-height: 60px; font-weight: 800; }
.step { width: 50px; height: 50px; border-radius: 14px; background: var(--sunken); display: grid; place-items: center; }
.step svg { width: 20px; height: 20px; fill: none; stroke: var(--ink); stroke-width: 2.500; stroke-linecap: round; }
.hint { font-size: 12px; line-height: 16px; color: var(--muted); margin: 0; }
.cta { height: 52px; border-radius: 16px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 700 16px/22px var(--sans); }
.more { text-align: center; font: 600 14px/20px var(--sans); color: var(--accent); padding: 4px 0 2px; }
</style>

<div class="intro">
  <h1>Три направления для Progress Bar</h1>
  <p>Один и тот же экран тренировки в трёх палитрах. Во всех трёх стекло — основной материал: карточки и панель ввода полупрозрачные, под ними цветной свет. Отличаются только цвета и настроение.</p>
</div>

<div class="row" id="row"></div>

<script>
const options = [
  { v: "sea", name: "1. Морское стекло", note: "Светлая. Бирюза, небо и тёплый персик под матовым стеклом. Акцент — глубокий зелёно-бирюзовый." },
  { v: "dusk", name: "2. Закат", note: "Тёмная тёплая. Коралл, янтарь и малина на сливовом фоне. Акцент — янтарный." },
  { v: "night", name: "3. Ночной бассейн", note: "Тёмная холодная. Бирюза, синий и зелёный свет на глубоком сине-зелёном. Акцент — мятный." },
];
const minus = '<svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>';
const plus = '<svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg>';
const field = (label, value) => `<div class="field"><div><div class="label">${label}</div>${value}</div><div class="step">${minus}</div><div class="step">${plus}</div></div>`;
const screen = `
  <i class="blob one"></i><i class="blob two"></i><i class="blob three"></i>
  <div class="screen">
    <div class="top">
      <h3>Грудь и трицепс</h3>
      <div class="barbell"><div class="bar"><i class="plate done"></i><i class="plate done"></i><i class="plate now"></i><i class="plate"></i><i class="plate"></i><i class="collar"></i></div><span class="num count">2<span class="unit">из 5</span></span></div>
    </div>
    <div class="glass item"><div><b>Жим лёжа</b><br><span class="chip ok">по плану</span></div><span class="num fact">3 × 8 × 60<span class="unit">кг</span></span></div>
    <div class="glass item"><div><b>Жим на наклонной</b><br><span class="chip under">−2 кг от плана</span></div><span class="num fact">3 × 10 × 20<span class="unit">кг</span></span></div>
    <div class="glass item current"><b>Разводка в кроссовере</b><span class="plan">сейчас</span></div>
    <div class="glass item"><b>Французский жим</b><span class="plan">3 × 10 × 25 кг</span></div>
    <div class="glass entry">
      <div class="head"><b>Разводка в кроссовере</b><span class="num">план 3 × 12 × 15<span class="unit">кг</span></span></div>
      ${field("Подходы", '<span class="num value">3</span>')}
      ${field("Повторения", '<span class="num value">12</span>')}
      ${field("Вес", '<span class="num value hero">15<span class="unit" style="font-size:24px">кг</span></span>')}
      <p class="hint">Прошлый раз: 3 × 12 × 12,5 кг</p>
      <div class="cta">Записать</div>
      <div class="more">Добавить каждый подход</div>
    </div>
  </div>`;
document.getElementById("row").innerHTML = options.map(o =>
  `<section class="option"><h2>${o.name}</h2><p>${o.note}</p><div class="phone" data-v="${o.v}">${screen}</div></section>`).join("");
</script>
