<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Выбор упражнения из справочника, тема Рассвет</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pb.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="pb" data-theme="{{theme}}" style="width: 390px; height: 844px">
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="scr">
<div class="left"><a class="icon" href="BuilderDawn.dc.html" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg></a><h1 class="title">Упражнение</h1></div>
<label class="field" style="gap: 10px; font-weight: 400; font-size: 17px"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.500"></circle><path d="M16 16l4.500 4.500"></path></svg><input type="search" aria-label="Поиск упражнения" value="жим" style="flex: 1; min-width: 0; border: 0; background: none; color: inherit; font: inherit; outline: none"></label>
<div class="hscroll" role="tablist" aria-label="Группа мышц">
<button class="pill on">Все</button><button class="pill">Грудь</button><button class="pill">Спина</button><button class="pill">Ноги</button><button class="pill">Плечи</button>
</div>
<div class="stack">
<button class="glass card row" style="color: inherit; font: inherit; text-align: left; width: 100%"><span><span class="b">Жим лёжа</span><br><span class="cap">Грудь · штанга</span></span><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"></path></svg></button>
<button class="glass card row" style="color: inherit; font: inherit; text-align: left; width: 100%"><span><span class="b">Жим гантелей на наклонной</span><br><span class="cap">Грудь · гантели</span></span><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"></path></svg></button>
<button class="glass card row" style="color: inherit; font: inherit; text-align: left; width: 100%"><span><span class="b">Жим ногами</span><br><span class="cap">Ноги · тренажёр</span></span><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"></path></svg></button>
<button class="glass card row" style="color: inherit; font: inherit; text-align: left; width: 100%"><span><span class="b">Жим стоя</span><br><span class="cap">Плечи · штанга</span></span><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"></path></svg></button>
<button class="glass card row" style="color: inherit; font: inherit; text-align: left; width: 100%"><span><span class="b">Французский жим</span><br><span class="cap">Трицепс · штанга</span></span><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"></path></svg></button>
</div>
<div class="grow"></div>
<button class="btn ghost"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"></path></svg>Своё упражнение</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dusk","dawn"],"default":"dawn"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'dawn' };
}
}
</script>
</body>
</html>
