<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Приглашение: выбор роли</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pb.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="pb" data-theme="{{theme}}" style="width: 390px; height: 844px">
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="scr" style="gap: 16px">
<div class="left"><a class="icon" href="People.dc.html" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg></a><h1 class="title">Пригласить</h1></div>
<p class="text">Кем вы будете для человека, которого приглашаете?</p>
<div class="stack" role="radiogroup" aria-label="Роль">
<button class="glass choice current" role="radio" aria-checked="true"><span class="h">Я тренер</span><span class="cap">Буду составлять ему программы и видеть его тренировки.</span></button>
<button class="glass choice" role="radio" aria-checked="false"><span class="h">Я подопечный</span><span class="cap">Он будет составлять мне программы и видеть мои тренировки.</span></button>
</div>
<div class="grow"></div>
<a class="btn" href="InviteCode.dc.html">Создать приглашение</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dusk","dawn"],"default":"dusk"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'dusk' };
}
}
</script>
</body>
</html>
