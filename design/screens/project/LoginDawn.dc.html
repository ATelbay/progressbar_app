<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход по номеру телефона, тема Рассвет</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pb.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="pb" data-theme="{{theme}}" style="width: 390px; height: 844px">
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="scr" style="padding-top: 120px; gap: 24px">
<div>
<div class="num" style="font-size: 88px; line-height: 80px; font-weight: 800; white-space: normal">Progress Bar</div>
<div class="barbell" style="margin-top: 16px" role="img" aria-label="Гриф с блинами">
<div class="bar"><div class="plate done"></div><div class="plate done"></div><div class="plate done"></div><div class="plate now"></div><div class="plate"></div><div class="collar"></div></div>
</div>
</div>
<p class="muted" style="margin: 0">Журнал тренировок. Тренер пишет план, вы — что получилось.</p>
<div class="grow"></div>
<section class="glass panel" style="padding: 16px; display: grid; gap: 12px">
<label class="label" for="phone">Номер телефона</label>
<input id="phone" class="field" type="tel" value="+7 701 234 56 78">
<a class="btn" href="HomeDawn.dc.html">Получить код</a>
<div class="cap" style="text-align: center">Пришлём код в SMS. Пароль не нужен.</div>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dusk","dawn"],"default":"dawn"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'dawn' };
}
}
</script>
</body>
</html>
