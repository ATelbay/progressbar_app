<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>План упражнения, вес ещё не записывали</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pb.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="pb" data-theme="{{theme}}" style="width: 390px; height: 844px">
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="scr">
<div class="left">
<a class="icon" href="Home.dc.html" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 class="title">Сила, 3 дня</h1>
</div>
<div class="hscroll" role="tablist" aria-label="Дни программы">
<button class="pill on">Грудь и трицепс</button>
<button class="pill">Спина и бицепс</button>
<button class="pill">Ноги</button>
</div>
</div>
<div class="scrim"></div>
<section class="glass panel sheet" role="dialog" aria-label="План упражнения">
<div style="display: grid; gap: 2px">
<h2 class="h">Французский жим</h2>
<div class="cap">Раньше не записывали — введите вес</div>
</div>
<div class="erow">
<div><div class="label">Подходы</div><span class="num n-lg">3</span></div>
<button class="icon step" aria-label="Меньше подходов"><svg viewBox="0 0 24 24"><path d="M6 12h12"></path></svg></button>
<button class="icon step" aria-label="Больше подходов"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"></path></svg></button>
</div>
<div class="erow">
<div><div class="label">Повторения</div><span class="num n-lg">10</span></div>
<button class="icon step" aria-label="Меньше повторений"><svg viewBox="0 0 24 24"><path d="M6 12h12"></path></svg></button>
<button class="icon step" aria-label="Больше повторений"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"></path></svg></button>
</div>
<div>
<div class="label">Вес</div>
<span class="num n-lg" style="display: inline-block; min-width: 120px; box-shadow: inset 0 -3px 0 var(--accent-text)">2<span class="unit" style="font-size: 24px">кг</span></span>
</div>
<div class="keys">
<button class="pill key">1</button><button class="pill key">2</button><button class="pill key">3</button>
<button class="pill key">4</button><button class="pill key">5</button><button class="pill key">6</button>
<button class="pill key">7</button><button class="pill key">8</button><button class="pill key">9</button>
<button class="pill key" aria-label="Запятая">,</button><button class="pill key">0</button><button class="pill key" aria-label="Стереть"><svg viewBox="0 0 24 24"><path d="M9 6h10a1 1 0 011 1v10a1 1 0 01-1 1H9l-6-6 6-6zM12 10l4 4M16 10l-4 4"></path></svg></button>
</div>
<a class="btn" href="BuilderPlan.dc.html">Готово</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dusk","dawn"],"default":"dusk"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'dusk' };
}
}
</script>
</body>
</html>
