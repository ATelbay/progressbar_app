<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Главная</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pb.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="pb" data-theme="{{theme}}" style="width: 390px; height: 844px">
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="scr tabs">
<h1 class="title">Главная</h1>
<section class="glass panel" style="padding: 16px; display: grid; gap: 12px" aria-label="Активная тренировка">
<div class="label">Идёт тренировка</div>
<h2 class="h">Грудь и трицепс</h2>
<div class="barbell" role="img" aria-label="Выполнено 2 из 5 упражнений">
<div class="bar"><div class="plate done"></div><div class="plate done"></div><div class="plate now"></div><div class="plate"></div><div class="plate"></div><div class="collar"></div></div>
<span class="num n-md">2<span class="unit">из 5</span></span>
</div>
<a class="btn" href="Main.dc.html">Продолжить</a>
</section>
<div class="label" style="margin-top: 8px">Мои программы</div>
<div class="stack">
<a class="glass card row" href="Builder.dc.html" style="color: inherit; text-decoration: none">
<div><div class="b">Сила, 3 дня</div><div class="cap">Назначил Сергей</div></div>
<span class="chip">3 дня</span>
</a>
<a class="glass card row" href="Builder.dc.html" style="color: inherit; text-decoration: none">
<div><div class="b">Домашняя</div><div class="cap">Своя программа</div></div>
<span class="chip">2 дня</span>
</a>
</div>
<div class="grow"></div>
<button class="btn ghost">Тренировка без программы</button>
<a class="btn text" href="Builder.dc.html">Новая программа</a>
</div>
<nav class="glass panel tabbar" aria-label="Разделы">
<a class="tab on" href="Home.dc.html"><svg viewBox="0 0 24 24"><path d="M3 12h18M6 8v8M18 8v8M3.5 10v4M20.5 10v4"></path></svg>Главная</a>
<a class="tab" href="History.dc.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>История</a>
<a class="tab" href="Progress.dc.html"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9"></path><path d="M4 21h16"></path></svg>Прогресс</a>
<a class="tab" href="People.dc.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.5"></circle><path d="M2.5 19c.6-3.2 3.2-5 6.5-5s5.9 1.8 6.5 5"></path><path d="M16 5.8a3.5 3.5 0 010 6.4M18.5 14.6c1.6.8 2.7 2.3 3 4.4"></path></svg>Люди</a>
<a class="tab" href="Profile.dc.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"></circle><path d="M4.5 20c.8-3.6 3.8-5.5 7.5-5.5s6.7 1.9 7.5 5.5"></path></svg>Профиль</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dusk","dawn"],"default":"dusk"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'dusk' };
}
}
</script>
</body>
</html>
