<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Тренировка без сети</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pb.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="pb" data-theme="{{theme}}" style="width: 390px; height: 844px">
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="scr" style="gap: 8px">
<div class="row"><h1 class="title">Грудь и трицепс</h1><button class="btn text small">Завершить</button></div>
<div class="barbell" role="img" aria-label="Выполнено 2 из 5 упражнений"><div class="bar"><div class="plate done"></div><div class="plate done"></div><div class="plate now"></div><div class="plate"></div><div class="plate"></div><div class="collar"></div></div><span class="num n-md">2<span class="unit">из 5</span></span></div>
<div class="banner" role="status"><svg viewBox="0 0 24 24"><path d="M3 3l18 18"></path><path d="M7 18h10a4 4 0 001.500-7.700M16 8.500A6 6 0 006.300 7.300 4.500 4.500 0 007 18"></path></svg><span>Нет сети. 2 записи сохранены на телефоне и отправятся сами, даже если закрыть приложение.</span></div>
<div class="glass card row">
<div><div class="b">Жим лёжа</div><span class="chip under">не отправлено</span></div>
<span class="num n-sm">3 × 8 × 60<span class="unit">кг</span></span>
</div>
<div class="glass card row">
<div><div class="b">Жим на наклонной</div><span class="chip under">не отправлено</span></div>
<span class="num n-sm">3 × 10 × 20<span class="unit">кг</span></span>
</div>
<section class="glass panel entry" aria-label="Запись результата">
<h2 class="h">Разводка в кроссовере</h2>
<div class="row"><span class="label">План</span><span class="num n-sm plan">3 × 12 × 15<span class="unit">кг</span></span></div>
<div class="erow"><div><div class="label">Подходы</div><span class="num n-lg">3</span></div><button class="icon step" aria-label="Меньше подходов"><svg viewBox="0 0 24 24"><path d="M6 12h12"></path></svg></button><button class="icon step" aria-label="Больше подходов"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"></path></svg></button></div>
<div class="erow"><div><div class="label">Повторения</div><span class="num n-lg">12</span></div><button class="icon step" aria-label="Меньше повторений"><svg viewBox="0 0 24 24"><path d="M6 12h12"></path></svg></button><button class="icon step" aria-label="Больше повторений"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"></path></svg></button></div>
<div class="erow"><div><div class="label">Вес</div><span class="num n-hero">15<span class="unit" style="font-size: 28px">кг</span></span></div><button class="icon step" aria-label="Меньше вес"><svg viewBox="0 0 24 24"><path d="M6 12h12"></path></svg></button><button class="icon step" aria-label="Больше вес"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"></path></svg></button></div>
<button class="btn">Записать</button>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dusk","dawn"],"default":"dusk"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'dusk' };
}
}
</script>
</body>
</html>
