<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Подтверждение удаления аккаунта</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pb.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="pb" data-theme="{{theme}}" style="width: 390px; height: 844px">
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="scr tabs">
<h1 class="title">Профиль</h1>
<section class="glass panel" style="padding: 16px" aria-label="Аккаунт">
<div class="left"><div class="avatar" style="width: 56px; height: 56px">А</div><div><div class="h">Арман</div><div class="cap">+7 701 234 56 78</div></div></div>
</section>
</div>
<div class="scrim"></div>
<section class="glass panel sheet" role="dialog" aria-label="Удалить аккаунт">
<h2 class="h">Удалить аккаунт?</h2>
<p>Удалятся ваши программы, все тренировки и связи с тренерами и подопечными. Восстановить их будет нельзя.</p>
<label class="label" for="confirm">Чтобы подтвердить, введите «удалить»</label>
<input id="confirm" class="field" type="text" value="">
<button class="btn destructive">Удалить навсегда</button>
<a class="btn ghost" href="Profile.dc.html">Оставить аккаунт</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dusk","dawn"],"default":"dusk"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'dusk' };
}
}
</script>
</body>
</html>
