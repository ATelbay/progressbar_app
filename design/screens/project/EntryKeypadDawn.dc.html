<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ввод веса с клавиатуры, тема Рассвет</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pb.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="pb" data-theme="{{theme}}" style="width: 390px; height: 844px">
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="scr" style="gap: 8px">
<div class="row"><h1 class="title">Грудь и трицепс</h1><button class="btn text small">Завершить</button></div>
<div class="barbell" role="img" aria-label="Выполнено 2 из 5 упражнений"><div class="bar"><div class="plate done"></div><div class="plate done"></div><div class="plate now"></div><div class="plate"></div><div class="plate"></div><div class="collar"></div></div><span class="num n-md">2<span class="unit">из 5</span></span></div>
<section class="glass panel entry" aria-label="Ввод веса">
<h2 class="h">Разводка в кроссовере</h2>
<div class="row"><span class="label">План</span><span class="num n-sm plan">3 × 12 × 15<span class="unit">кг</span></span></div>
<div class="row" style="align-items: end">
<div><div class="label">Вес</div><span class="num n-hero" style="box-shadow: inset 0 -3px 0 var(--accent-text)">42,5<span class="unit" style="font-size: 28px">кг</span></span></div>
<div class="row" style="gap: 6px"><button class="pill">+2,5</button><button class="pill">+5</button><button class="pill">+10</button></div>
</div>
<div class="keys">
<button class="pill key">1</button><button class="pill key">2</button><button class="pill key">3</button>
<button class="pill key">4</button><button class="pill key">5</button><button class="pill key">6</button>
<button class="pill key">7</button><button class="pill key">8</button><button class="pill key">9</button>
<button class="pill key" aria-label="Запятая">,</button><button class="pill key">0</button><button class="pill key" aria-label="Стереть"><svg viewBox="0 0 24 24"><path d="M9 6h10a1 1 0 011 1v10a1 1 0 01-1 1H9l-6-6 6-6zM12 10l4 4M16 10l-4 4"></path></svg></button>
</div>
<a class="btn" href="MainDawn.dc.html">Готово</a>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dusk","dawn"],"default":"dawn"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'dawn' };
}
}
</script>
</body>
</html>
