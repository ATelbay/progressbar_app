<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Подопечный, доступ только на просмотр</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pb.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="pb" data-theme="{{theme}}" style="width: 390px; height: 844px">
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="scr">
<div class="left"><a class="icon" href="People.dc.html" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg></a><div class="avatar">А</div><h1 class="title">Айгерим</h1></div>
<div class="banner" role="note"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.500"></circle><path d="M12 8v5M12 16v.500"></path></svg><span>Вы больше не активный тренер Айгерим. Тренировки видны, назначать программы нельзя.</span></div>
<div class="glass seg" role="tablist" aria-label="Какие тренировки показывать">
<button class="pill on">Мои</button><button class="pill">Все</button>
</div>
<div class="stack">
<div class="glass card row"><div><div class="b">20 сентября · Ноги</div><div class="cap">Сила, 3 дня</div></div><span class="chip ok">по плану</span></div>
<div class="glass card row"><div><div class="b">18 сентября · Спина и бицепс</div><div class="cap">Сила, 3 дня</div></div><span class="chip under">ниже плана</span></div>
</div>
<p class="cap" style="margin: 0">Во вкладке «Все» видны и тренировки с другим тренером.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dusk","dawn"],"default":"dusk"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'dusk' };
}
}
</script>
</body>
</html>
