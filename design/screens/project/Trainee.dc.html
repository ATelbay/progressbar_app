<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Подопечный глазами тренера</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pb.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="pb" data-theme="{{theme}}" style="width: 390px; height: 844px">
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="scr">
<div class="left">
<a class="icon" href="People.dc.html" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div class="avatar">А</div>
<h1 class="title">Айгерим</h1>
</div>
<div class="glass seg" role="tablist" aria-label="Какие тренировки показывать">
<button class="pill on">Мои</button>
<button class="pill">Все</button>
</div>
<div class="stack">
<div class="glass card" style="display: grid; gap: 6px">
<div class="row"><div><div class="b">Вчера · Ноги</div><div class="cap">Сила, 3 дня</div></div><span class="chip under">ниже плана</span></div>
<div class="row"><span class="cap">Приседания</span><span style="display: flex; align-items: baseline; gap: 12px"><span class="num n-sm plan">3 × 6 × 80</span><span class="num n-md">3 × 6 × 75<span class="unit">кг</span></span></span></div>
</div>
<div class="glass card row">
<div><div class="b">1 октября · Спина и бицепс</div><div class="cap">Сила, 3 дня</div></div><span class="chip ok">по плану</span>
</div>
<div class="glass card row">
<div><div class="b">29 сентября · Грудь и трицепс</div><div class="cap">Сила, 3 дня</div></div><span class="chip ok">по плану</span>
</div>
</div>
<div class="label" style="margin-top: 8px">Назначенные программы</div>
<a class="glass card row" href="Builder.dc.html" style="color: inherit; text-decoration: none">
<div><div class="b">Сила, 3 дня</div><div class="cap">Назначена 20 сентября</div></div>
<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg>
</a>
<div class="grow"></div>
<button class="btn">Назначить программу</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dusk","dawn"],"default":"dusk"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'dusk' };
}
}
</script>
</body>
</html>
