<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Деактивация и удаление тренера</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pb.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="pb" data-theme="{{theme}}" style="width: 390px; height: 844px">
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="scr tabs">
<h1 class="title">Люди</h1>
<div class="label">Мои тренеры</div>
<div class="glass card row"><div class="left"><div class="avatar">С</div><div><div class="b">Сергей</div><div class="cap">Назначает программы</div></div></div><span class="chip on">активный</span></div>
</div>
<div class="scrim"></div>
<section class="glass panel sheet" role="dialog" aria-label="Что сделать с тренером">
<div class="left"><div class="avatar">С</div><h2 class="h">Сергей, тренер</h2></div>
<div class="stack">
<button class="btn ghost">Деактивировать</button>
<div class="cap">Сергей продолжит видеть ваши тренировки, но не сможет назначать программы.</div>
</div>
<div class="stack">
<button class="btn destructive">Удалить</button>
<div class="cap">Сергей потеряет доступ полностью. Ваши тренировки останутся у вас.</div>
</div>
<a class="btn text" href="People.dc.html">Ничего не менять</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dusk","dawn"],"default":"dusk"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'dusk' };
}
}
</script>
</body>
</html>
