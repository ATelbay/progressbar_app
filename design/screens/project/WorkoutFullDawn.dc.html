<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Тренировка, ввод по подходам, тема Рассвет</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pb.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="pb" data-theme="{{theme}}" style="width: 390px; height: 844px">
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="scr" style="gap: 8px">
<div class="row">
<h1 class="title">Грудь и трицепс</h1>
<button class="btn text small">Завершить</button>
</div>
<div class="barbell" role="img" aria-label="Выполнено 2 из 5 упражнений">
<div class="bar"><div class="plate done"></div><div class="plate done"></div><div class="plate now"></div><div class="plate"></div><div class="plate"></div><div class="collar"></div></div>
<span class="num n-md">2<span class="unit">из 5</span></span>
</div>
<div class="glass card row current">
<div class="b">Разводка в кроссовере</div>
<span class="cap">сейчас</span>
</div>
<section class="glass panel entry" aria-label="Запись по подходам">
<h2 class="h">Разводка в кроссовере</h2>
<div>
<div class="pf first"><span class="label">№</span><span class="label">План</span><span class="label">Факт</span><span></span></div>
<div class="pf"><span class="num n-sm plan">1</span><span class="num n-sm plan">15<span class="unit">кг</span> × 12</span><span class="num n-md">15<span class="unit">кг</span> × 12</span><span class="chip ok">по плану</span></div>
<div class="pf"><span class="num n-sm plan">2</span><span class="num n-sm plan">15<span class="unit">кг</span> × 12</span><span class="num n-md">15<span class="unit">кг</span> × 10</span><span class="chip under">−2</span></div>
<div class="pf"><span class="num n-sm plan">3</span><span class="num n-sm plan">15<span class="unit">кг</span> × 12</span><span class="num n-md plan">—</span><span class="chip on">сейчас</span></div>
</div>
<div class="erow">
<div><div class="label">Повторения</div><span class="num n-lg">10</span></div>
<button class="icon step" aria-label="Меньше повторений"><svg viewBox="0 0 24 24"><path d="M6 12h12"></path></svg></button>
<button class="icon step" aria-label="Больше повторений"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"></path></svg></button>
</div>
<div class="erow">
<div><div class="label">Вес</div><span class="num n-hero">15<span class="unit" style="font-size: 28px">кг</span></span></div>
<button class="icon step" aria-label="Меньше вес"><svg viewBox="0 0 24 24"><path d="M6 12h12"></path></svg></button>
<button class="icon step" aria-label="Больше вес"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"></path></svg></button>
</div>
<div>
<div class="label" style="margin-bottom: 6px">Тяжесть, по желанию</div>
<div class="row" style="gap: 6px">
<button class="pill" style="flex: 1; padding: 0">6</button>
<button class="pill" style="flex: 1; padding: 0">7</button>
<button class="pill on" style="flex: 1; padding: 0">8</button>
<button class="pill" style="flex: 1; padding: 0">9</button>
<button class="pill" style="flex: 1; padding: 0">10</button>
</div>
</div>
<button class="btn">Записать подход 3</button>
<div class="row">
<button class="btn text small">Сверх плана</button>
<a class="btn text small" href="MainDawn.dc.html">Только итог</a>
</div>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dusk","dawn"],"default":"dawn"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'dawn' };
}
}
</script>
</body>
</html>
